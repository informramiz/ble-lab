name: BLELab
options:
  bundleIdPrefix: com.codebyramiz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BLELabKit:
    path: BLELabKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  BLELab:
    type: application
    platform: iOS
    sources: [App/BLELab]
    dependencies:
      - package: BLELabKit
    info:
      path: App/BLELab/Info.plist
      properties:
        CFBundleDisplayName: BLE Lab
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: BLE Lab connects to your ESP32 board to stream its sensor and switch its LED.
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codebyramiz.blelab
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  BLELab:
    build:
      targets:
        BLELab: all
